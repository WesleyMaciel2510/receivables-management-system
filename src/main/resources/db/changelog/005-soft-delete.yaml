databaseChangeLog:
  - changeSet:
      id: 007-soft-delete-clients
      author: rms
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: clients
      changes:
        - addColumn:
            tableName: clients
            columns:
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: clients
            columnName: deleted_at

