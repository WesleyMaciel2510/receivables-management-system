              - column: { name: compe_code, value: '033' }
              - column: { name: ispb, value: '90400888' }
              - column: { name: name, value: 'Santander' }
        - insert:
            tableName: banks
            columns:
              - column: { name: id, value: '8d7a7f7a-4b3f-4d7c-9e53-5f6a2d4d0003' }
              - column: { name: compe_code, value: '104' }
              - column: { name: ispb, value: '00360305' }
              - column: { name: name, value: 'Caixa Econômica Federal' }
        - insert:
            tableName: banks
            columns:
              - column: { name: id, value: '8d7a7f7a-4b3f-4d7c-9e53-5f6a2d4d0004' }
              - column: { name: compe_code, value: '237' }
              - column: { name: ispb, value: '60746948' }
              - column: { name: name, value: 'Bradesco' }
        - insert:
            tableName: banks
            columns:
              - column: { name: id, value: '8d7a7f7a-4b3f-4d7c-9e53-5f6a2d4d0005' }
              - column: { name: compe_code, value: '341' }
              - column: { name: ispb, value: '60701190' }
              - column: { name: name, value: 'Itaú Unibanco' }
        - insert:
            tableName: banks
            columns:
              - column: { name: id, value: '8d7a7f7a-4b3f-4d7c-9e53-5f6a2d4d0006' }
              - column: { name: compe_code, value: '260' }
              - column: { name: ispb, value: '18236120' }
              - column: { name: name, value: 'Nubank' }
      rollback:
        - delete:
            tableName: banks
            where: compe_code IN ('001', '033', '104', '237', '341', '260')
