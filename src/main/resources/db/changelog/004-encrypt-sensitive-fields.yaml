databaseChangeLog:
  - changeSet:
      id: 006-encrypt-sensitive-fields
      author: rms
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: clients
        - tableExists:
            tableName: receivables
      changes:
        - dropUniqueConstraint:
            tableName: clients
            constraintName: clients_cpf_cnpj_uq
        - dropUniqueConstraint:
            tableName: clients
            constraintName: clients_email_uq
        - modifyDataType:
            tableName: clients
            columnName: cpf_cnpj
            newDataType: VARCHAR(1024)
        - modifyDataType:
            tableName: clients
            columnName: email
            newDataType: VARCHAR(1024)
        - modifyDataType:
            tableName: clients
            columnName: phone
            newDataType: VARCHAR(1024)
        - modifyDataType:
            tableName: receivables
            columnName: description
            newDataType: VARCHAR(2048)
        - addColumn:
            tableName: clients
            columns:
              - column:
                  name: cpf_cnpj_hash
                  type: CHAR(64)
              - column:
                  name: email_hash
                  type: CHAR(64)
        - addUniqueConstraint:
            tableName: clients
            columnNames: cpf_cnpj_hash
            constraintName: clients_cpf_cnpj_hash_uq
        - addUniqueConstraint:
            tableName: clients
            columnNames: email_hash
            constraintName: clients_email_hash_uq
      rollback:
        - dropUniqueConstraint:
            tableName: clients
            constraintName: clients_email_hash_uq
        - dropUniqueConstraint:
            tableName: clients
            constraintName: clients_cpf_cnpj_hash_uq
        - dropColumn:
            tableName: clients
            columnName: email_hash
        - dropColumn:
            tableName: clients
            columnName: cpf_cnpj_hash
        - modifyDataType:
            tableName: receivables
            columnName: description
            newDataType: VARCHAR(500)
        - modifyDataType:
            tableName: clients
            columnName: phone
            newDataType: VARCHAR(32)
        - modifyDataType:
            tableName: clients
            columnName: email
            newDataType: VARCHAR(254)
        - modifyDataType:
            tableName: clients
            columnName: cpf_cnpj
            newDataType: VARCHAR(14)
        - addUniqueConstraint:
            tableName: clients
            columnNames: cpf_cnpj
            constraintName: clients_cpf_cnpj_uq
        - addUniqueConstraint:
            tableName: clients
            columnNames: email
            constraintName: clients_email_uq
