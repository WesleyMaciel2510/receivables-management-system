name: SonarQube Analysis

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      sonarqube:
        image: sonarqube:community
        env:
          SONAR_FORCEAUTHENTICATION: "false"
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Wait for SonarQube to be ready
        run: |
          echo "Waiting for SonarQube on http://localhost:9000 ..."
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube is UP."
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time." >&2
          exit 1

      - name: Generate SonarQube analysis token
        run: |
          for i in $(seq 1 12); do
            TOKEN=$(curl -fsS -u admin:admin -X POST \
              "http://localhost:9000/api/user_tokens/generate?name=ci" | jq -r '.token')
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              echo "::add-mask::$TOKEN"
              echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to generate a SonarQube analysis token." >&2
          exit 1

      - name: Build, test and analyze
        run: >-
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=rms-backend
          -Dsonar.host.url=http://localhost:9000
          -Dsonar.token=$SONAR_TOKEN
